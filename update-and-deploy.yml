name: Atualizar dados e publicar

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 09:00 UTC (06:00 Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar dados atualizados (CVM/BCB)
        run: node scripts/fetchFundData.js

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/funds.json
          git diff --staged --quiet || git commit -m "Atualiza dados dos fundos [automático]"
          git push

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload do site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        uses: actions/deploy-pages@v4
